# Workflow for building and deploying an Academic Pages / Jekyll site to GitHub Pages
name: Deploy Academic Pages template site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Publishing is paused by default; ordinary pushes only check the build.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish this website publicly on GitHub Pages'
        type: boolean
        required: true
        default: false

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-24.04
    outputs:
      artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'        
      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Configure GitHub Pages
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: |
          if [ "$PUBLISH_SITE" = "true" ]; then
            bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
          else
            JEKYLL_ENV=preview bundle exec jekyll build --config _config.yml,_config_docker.yml --baseurl ""
          fi
        env:
          JEKYLL_ENV: production
          PUBLISH_SITE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
      - name: Check desktop and mobile layouts
        if: github.event_name == 'push'
        run: python scripts/verify-layout.py
      - name: Upload private layout preview
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v7.0.0
        with:
          name: layout-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/academic-preview
          retention-days: 3
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

  # Deployment job
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
