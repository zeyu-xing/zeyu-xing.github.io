{% include base_path %}
{% assign author = site.author %}

<div class="author-profile" itemscope itemtype="https://schema.org/Person">
  {% if author.avatar and author.avatar != '' %}
    <div class="author__avatar">
      <img src="{% unless author.avatar contains '://' %}{{ base_path }}/images/{% endunless %}{{ author.avatar }}" alt="{{ author.name | escape }}" />
    </div>
  {% endif %}
  <div class="author__content">
    <h2 class="author__name" itemprop="name">{{ author.name }}</h2>
    <p class="profile-position" itemprop="jobTitle">{{ author.bio }}</p>
    <p class="profile-affiliation">
      <a href="{{ author.department_url }}">{{ author.department }}</a><br />
      {{ author.employer }}
    </p>
    <p class="profile-location">{{ author.location }}</p>
  </div>
  {% if author.email_display %}
    <div class="profile-contact">
      <span class="profile-label">Email</span>
      <span class="profile-email">{{ author.email_display }}</span>
      <button type="button" class="copy-email" data-user="{{ author.email_user }}" data-domain="{{ author.email_domain }}">Copy email</button>
      <span class="email-status" role="status" aria-live="polite"></span>
    </div>
  {% endif %}
</div>
