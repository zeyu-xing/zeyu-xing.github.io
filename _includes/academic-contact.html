<div class="contact-line">
  <span class="contact-label">Email:</span>
  <span class="email-display">{{ site.author.email_display }}</span>
  <button type="button" class="copy-email" data-user="{{ site.author.email_user }}" data-domain="{{ site.author.email_domain }}" aria-label="Copy email address">copy</button>
  <span class="email-status" role="status" aria-live="polite"></span>
</div>
